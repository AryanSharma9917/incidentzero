apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: incidentzero-demo
spec:
  template:
    spec:
      containers:
        - name: payment-api
          env:
            - name: DATABASE_HOST
              value: database
            - name: MEMORY_LOAD_MB
              value: "96"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
